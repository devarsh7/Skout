<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skout · Creator Result Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#F8FAFD; font-family: var(--font-body); }
  .card { background:#fff; border:1px solid var(--border); border-radius:14px; padding: 20px; box-shadow: var(--shadow-sm); }
  .grid { display:grid; grid-template-columns: 3fr 2fr 2fr; gap: 20px; }
  .name { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--navy); margin: 0 0 4px; }
  .bio { font-size: 13px; color: var(--muted); margin: 0 0 8px; line-height: 1.5; }
  .chips { display:flex; gap:5px; flex-wrap:wrap; margin-bottom: 6px; }
  .chip { background: var(--blue-50); color: var(--blue-700); border: 1px solid var(--blue-100); padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .loc { font-size: 11px; color: var(--muted); }
  .metric { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--navy); line-height: 1.1; }
  .metric-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .score { background: var(--blue-600); color:#fff; border-radius: 10px; padding: 10px 12px; text-align:center; }
  .score .metric { color:#fff; }
  .score .metric-lbl { color: rgba(255,255,255,.85); }
  .reason { margin-top: 14px; padding: 10px 12px; background: var(--blue-50); border: 1px solid var(--blue-100); border-radius: 8px; font-size: 12px; color: var(--navy); }
  .reason b { color: var(--blue-700); }
</style>
</head>
<body>
  <div class="card">
    <div class="grid">
      <div>
        <div class="name">@priyastyles</div>
        <p class="bio">Toronto-based beauty creator focusing on clean, cruelty-free skincare.</p>
        <div class="chips"><span class="chip">beauty</span><span class="chip">sustainability</span><span class="chip">lifestyle</span></div>
        <div class="loc">📍 Toronto, CA</div>
      </div>
      <div style="display:flex; gap:16px;">
        <div><div class="metric">124K</div><div class="metric-lbl">Total followers</div></div>
        <div><div class="metric">4.82%</div><div class="metric-lbl">Engagement</div></div>
      </div>
      <div class="score">
        <div class="metric">0.91</div>
        <div class="metric-lbl">Match score</div>
      </div>
    </div>
    <div class="reason"><b>Why this match:</b> Strong Gen-Z audience in IN; clean-beauty niche matches your brief verbatim.</div>
  </div>
</body>
</html>
