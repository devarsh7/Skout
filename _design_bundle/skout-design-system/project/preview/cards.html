<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skout · Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px; background:#F8FAFD; font-family: var(--font-body); }
  .row { display:grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 22px; box-shadow: var(--shadow-sm); transition: all .25s ease; }
  .card.hover { border-color: var(--blue-100); box-shadow: var(--shadow-md); transform: translateY(-3px); }
  .icon { font-size: 1.6rem; display:block; margin-bottom: 10px; }
  .title { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--navy); margin: 0 0 5px; }
  .desc { font-size: 13px; color: var(--body); line-height: 1.6; margin: 0; }
  .flag { font-family: var(--font-mono); font-size: 10px; color: var(--muted); margin-top: 8px; display:block; }
</style>
</head>
<body>
  <div class="row">
    <div class="card">
      <span class="icon">🔒</span>
      <div class="title">Owned Data</div>
      <p class="desc">Every profile is opt-in. No scraping, no ToS violations, no surprise API bills.</p>
      <span class="flag">rest</span>
    </div>
    <div class="card hover">
      <span class="icon">🧠</span>
      <div class="title">Multi-Agent AI</div>
      <p class="desc">Discovery, Filtering, and Outreach agents coordinated by LangGraph.</p>
      <span class="flag">hover — lifted, blue border</span>
    </div>
  </div>
</body>
</html>
