<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skout · Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#FFFFFF; font-family: var(--font-body); }
  .row { display:grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .tile { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .box { width: 74px; height: 74px; background: var(--blue-50); border: 1.5px solid var(--blue-600); }
  .name { font-family: var(--font-display); font-weight:700; color: var(--navy); font-size: 12px; }
  .val { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="tile"><div class="box" style="border-radius:6px"></div><div class="name">xs</div><div class="val">6px</div></div>
    <div class="tile"><div class="box" style="border-radius:8px"></div><div class="name">sm</div><div class="val">8px</div></div>
    <div class="tile"><div class="box" style="border-radius:10px"></div><div class="name">md</div><div class="val">10px</div></div>
    <div class="tile"><div class="box" style="border-radius:14px"></div><div class="name">lg</div><div class="val">14px</div></div>
    <div class="tile"><div class="box" style="border-radius:16px"></div><div class="name">xl</div><div class="val">16px</div></div>
    <div class="tile"><div class="box" style="border-radius:20px"></div><div class="name">2xl</div><div class="val">20px</div></div>
    <div class="tile"><div class="box" style="border-radius:999px"></div><div class="name">pill</div><div class="val">999px</div></div>
  </div>
</body>
</html>
